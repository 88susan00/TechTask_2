name: techtask

services:

  site1:
    build: ./site1
    restart: unless-stopped
    networks:
      - web
    healthcheck:
      # nginx:alpine has busybox wget, curl is not guaranteed
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  site2:
    build: ./site2
    restart: unless-stopped
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  site3:
    build: ./site3
    restart: unless-stopped
    networks:
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Start the proxy only when the backends are actually healthy, not just started.
    depends_on:
      site1:
        condition: service_healthy
      site2:
        condition: service_healthy
      site3:
        condition: service_healthy
    networks:
      - web

networks:
  web:
    driver: bridge
