events {}

http {

    upstream site1 {
        server site1:80;
    }

    upstream site2 {
        server site2:80;
    }

    upstream site3 {
        server site3:8083;
    }

    # Pass the original client information to every backend.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {

        listen 80;

        # Healthcheck of the proxy itself (used by Docker and the watchdog).
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'OK';
        }

        location /site1/ {
            proxy_pass http://site1/;
        }

        location /site2/ {
            proxy_pass http://site2/;
        }

        location /site3/ {
            proxy_pass http://site3/;
        }
    }
}
